<div class="container">
  <div class="row">
    <div class="col-md-10 col-md-offset-1">
      <div class="panel panel-primary">
        <div class="panel-heading">
          <h2 class="text-center">Doctors List</h2>
        </div>
        <div class=" row mt-6">
          <div class="table-responsive">
<table class="table table-bordered">
  <thead>
    <tr>
      <th></th>
      <th>Doctor Id</th>
      <th>Doctor Name</th>
      <th>Rating</th>
      <th>Registration No</th>
    </tr>
  </thead>
  <tbody>
    <ng-container *ngFor="let doctor of doctors">
      <tr>
        <td (click)="toggleExpand(doctor)">
          <span class="arrow">
            <i *ngIf="!doctor.isExpand" class="arrow-down"></i>
            <i *ngIf="doctor.isExpand" class="arrow-up"></i>
          </span>
        </td>
        <td>{{ doctor.id }}</td>
        <td>{{ doctor.fullName }}</td>
        <td>{{ doctor.rating }}</td>
        <td>{{ doctor.registrationNumber }}</td>
      </tr>
      <tr *ngIf="doctor.isExpand">
        <td colspan="5">
          <!-- Nested table or content to show/hide -->
          <table class="table nested-table">
            <thead>
              <tr>
                <!-- <th>Hospital Id</th> -->
                <th>Hospital Name</th>
                <th>Hospital Address</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let hospital of doctor.hospitals">
                <!-- <td>{{ hospital.id }}</td> -->
                <td>{{ hospital.hospitalName }}</td>
                <td>{{ hospital.hospitalAddress}}</td>
                <td>
                  <button  class="btn btn-info" (click)="openModal(doctor)">Book Appointment</button>
                </td>
              </tr>
            </tbody>
          </table>
        </td>
      </tr>
    </ng-container>
  </tbody>
</table> 
</div>
</div>
</div>
</div>
</div>
</div>
